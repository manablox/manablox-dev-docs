server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are immutable; HTML must never be cached or a deploy leaves
  # clients pinned to stale pages.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }

  # Starlight builds a real 404 page; `internal` keeps it from being routable itself.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

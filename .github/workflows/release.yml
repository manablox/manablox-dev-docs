name: Release

# The image is pushed when someone asks for it, not as a side effect of a push.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the image, but push nothing'
        type: boolean
        default: true
      latest:
        description: 'Also move the latest tag'
        type: boolean
        default: true

permissions:
  contents: read
  # The image goes to the GitHub Container Registry.
  packages: write

jobs:
  # The same gates as ci.yml: a release of stale or broken pages is refused.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm check

  # ghcr.io/manablox/dev-docs at the version in package.json, built for dev.manablox.io.
  image:
    name: image - dev-docs
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dev-docs
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCS_SITE_URL=https://dev.manablox.io
          provenance: mode=max
          cache-from: type=gha,scope=dev-docs
